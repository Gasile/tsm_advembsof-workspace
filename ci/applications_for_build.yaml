applications:
  - app: blinky
    boards:
      - board: nrf5340dk/nrf5340/cpuapp
      - board: qemu_x86
    configs:
      - gpio
      - log+debug+gpio
    configs_dir: ../deps/zpp_lib/configs

  - app: sanitize
    boards:
      - board: nrf5340dk/nrf5340/cpuapp
      - board: qemu_x86
    configs:
      - san
      - log+debug+san
    configs_dir: ../deps/zpp_lib/configs

  - app: bme280
    boards:
      - board: nrf5340dk/nrf5340/cpuapp
      - board: qemu_x86
    configs:
      - sensor
      - log+debug+sensor
    configs_dir: ../deps/zpp_lib/configs
